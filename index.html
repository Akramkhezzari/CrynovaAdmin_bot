<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crynova Admin</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* ========== الأنماط (نفسها مع التحسينات) ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #f0f4f8; --bg-secondary: #ffffff; --bg-card: #ffffff;
            --bg-input: #f0f4f8; --text-primary: #1a1a2e; --text-secondary: #4a4a6a;
            --text-muted: #8a8aaa; --accent: #6c5ce7; --accent-light: #a29bfe;
            --success: #00b894; --warning: #fdcb6e; --danger: #e17055; --info: #0984e3;
            --border: #e2e8f0; --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 32px rgba(0,0,0,0.08); --radius-sm: 10px; --radius-md: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 30px;
            overflow-x: hidden;
        }
        .app-container { max-width: 480px; margin: 0 auto; padding: 16px; }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 20px;
        }
        .app-header .logo {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .app-header .logo i { -webkit-text-fill-color: #6c5ce7; font-size: 24px; }
        .app-header .header-actions { display: flex; gap: 8px; }
        .app-header .header-actions button {
            width: 40px; height: 40px;
            border: none; border-radius: 50%;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-header .header-actions button:hover { transform: scale(1.05); box-shadow: var(--shadow-md); }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-md); border-color: var(--accent-light); }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 17px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-title i { color: var(--accent); font-size: 18px; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            width: 100%;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; box-shadow: 0 4px 24px rgba(108,92,231,0.25); }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-info { background: var(--info); color: white; }
        .btn-sm { padding: 10px 16px; font-size: 14px; }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text-primary); }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); background: rgba(108,92,231,0.08); }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; color: var(--text-secondary); font-size: 14px; margin-bottom: 6px; font-weight: 600; }
        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
            font-family: inherit;
        }
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(108,92,231,0.15);
        }

        .status {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .status-pending { background: #fef9e7; color: #b7950b; }
        .status-success { background: #e8f8f5; color: #00b894; }
        .status-danger { background: #fdedec; color: #e17055; }
        .status-info { background: #ebf5fb; color: #0984e3; }

        .admin-request-card {
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .admin-request-card:hover { border-color: var(--accent-light); }
        .admin-request-card .user-info { font-weight: 700; color: var(--accent); }
        .admin-request-card .details { font-size: 14px; color: var(--text-secondary); margin: 6px 0; }
        .admin-request-card .actions { display: flex; gap: 8px; margin-top: 10px; }
        .admin-request-card .actions .btn { padding: 8px 16px; font-size: 13px; width: auto; flex: 1; }

        .admin-empty { text-align: center; padding: 30px 0; color: var(--text-muted); }
        .admin-empty i { font-size: 48px; display: block; margin-bottom: 10px; }
        .admin-error { text-align: center; padding: 30px 0; color: var(--danger); }
        .admin-error i { font-size: 48px; display: block; margin-bottom: 10px; }

        .copy-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .copy-btn:hover { background: var(--accent-light); transform: scale(1.02); }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-16 { margin-top: 16px; }
        .mb-16 { margin-bottom: 16px; }
        .hidden { display: none !important; }
        .text-muted { color: var(--text-secondary); }
        .text-center { text-align: center; }
        .gap-8 { gap: 8px; }

        #unauthorizedMessage { padding: 40px 20px; text-align: center; }
        #unauthorizedMessage i { font-size: 64px; color: var(--danger); }
        #unauthorizedMessage h2 { margin-top: 16px; }

        .diagnostic-box {
            background: #f8f9fa;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            margin-top: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
        }
        .diagnostic-box.success { border-color: var(--success); background: #e8f8f5; }
        .diagnostic-box.error { border-color: var(--danger); background: #fdedec; }
    </style>
</head>
<body>

<div class="app-container">
    <header class="app-header">
        <div class="logo"><i class="fas fa-shield-alt"></i> لوحة الإدارة</div>
        <div class="header-actions">
            <button onclick="toggleTheme()" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button onclick="refreshAll()" title="تحديث"><i class="fas fa-sync-alt"></i></button>
        </div>
    </header>

    <div id="adminPanel">
        <h2 style="font-size:22px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:10px;">
            <i class="fas fa-shield-alt text-danger"></i> لوحة الإدارة
            <span id="adminStatusBadge" class="status status-success" style="font-size:12px;">✅ أدمن</span>
        </h2>

        <!-- تشخيص -->
        <div class="card" style="border:2px solid var(--info);">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-stethoscope text-info"></i> تشخيص الطلبات</div>
            </div>
            <div id="diagnosticInfo" class="diagnostic-box">⏳ جاري التحقق...</div>
            <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                <button class="btn btn-info btn-sm" onclick="fetchAllWithdrawals()" style="flex:1; min-width:100px;">
                    <i class="fas fa-list"></i> عرض الكل
                </button>
                <button class="btn btn-outline btn-sm" onclick="fetchPendingWithdrawals()" style="flex:1; min-width:100px;">
                    <i class="fas fa-clock"></i> المعلقة فقط
                </button>
            </div>
        </div>

        <!-- طلبات السحب -->
        <div class="card">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-arrow-up text-danger"></i> طلبات السحب</div>
                <span id="pendingWithdrawalsCount" class="status status-pending">0</span>
            </div>
            <div id="adminWithdrawalsList">
                <div class="admin-empty">
                    <i class="fas fa-spinner fa-spin"></i>
                    <div>جاري التحميل...</div>
                </div>
            </div>
        </div>

        <!-- تأكيد إيداع تلقائي (DZD فقط) -->
        <div class="card" style="border:2px solid var(--info);">
            <div class="card-header">
                <div class="card-title"><i class="fas fa-bolt text-info"></i> تأكيد إيداع تلقائي</div>
                <span class="status status-info">أتمتة</span>
            </div>
            <div class="input-group">
                <label>رقم العملية <span class="required">*</span></label>
                <input type="text" id="autoTxId" placeholder="أدخل رقم العملية">
            </div>
            <div class="input-group">
                <label>المبلغ (DZD) <span class="required">*</span></label>
                <input type="number" id="autoAmount" placeholder="المبلغ" step="0.01" min="0.01">
            </div>
            <button class="btn btn-info" onclick="autoConfirmDeposit()" style="color:white;">
                <i class="fas fa-check-circle"></i> تأكيد تلقائي
            </button>
            <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">
                <i class="fas fa-info-circle"></i> يتم البحث عن طلب إيداع معلق بنفس الرقم والمبلغ (DZD).
            </div>
        </div>
    </div>

    <!-- غير مصرح -->
    <div id="unauthorizedMessage" style="display:none;">
        <i class="fas fa-lock"></i>
        <h2>غير مصرح</h2>
        <p>ليس لديك صلاحية للدخول إلى لوحة الإدارة.</p>
        <button class="btn btn-primary" onclick="location.href='index.html'" style="margin-top:20px;width:auto;">
            <i class="fas fa-arrow-right"></i> العودة
        </button>
    </div>
</div>

<script>
    // ============================================================
    // 1. FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyDCF0h_UPivX8oGoQL8Dn1s0lr79VAXpMY",
        authDomain: "crynova-4d6b3.firebaseapp.com",
        projectId: "crynova-4d6b3",
        storageBucket: "crynova-4d6b3.firebasestorage.app",
        messagingSenderId: "858898515024",
        appId: "1:858898515024:web:03827d57c2737bbc27bd55"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ============================================================
    // 2. STATE
    // ============================================================
    let isAdmin = false;
    let userId = null;

    // ============================================================
    // 3. دوال مساعدة
    // ============================================================
    function formatDateTime(timestamp) {
        if (!timestamp) return '--';
        const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return d.toLocaleDateString('ar-EG', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
    }

    function showToast(msg, isError = false) {
        const old = document.querySelector('.custom-toast');
        if (old) old.remove();
        const t = document.createElement('div');
        t.className = 'custom-toast';
        t.style.cssText = `
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: ${isError ? 'var(--danger)' : 'var(--accent)'};
            color: #fff; padding: 12px 24px; border-radius: 30px;
            font-weight: 700; z-index: 9999; box-shadow: var(--shadow-md);
            font-family: 'Cairo', sans-serif; max-width: 90%; text-align: center;
            transition: opacity 0.3s;
        `;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    function copyText(text) {
        if (!text) { showToast('لا يوجد نص', true); return; }
        if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => showToast('تم النسخ'));
        } else {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('تم النسخ');
        }
    }

    // ============================================================
    // 4. جلب طلبات السحب من داخل وثائق المستخدمين
    // ============================================================
    async function fetchAllWithdrawals() {
        showToast('⏳ جلب جميع الطلبات...');
        try {
            const usersSnap = await db.collection('users').get();
            const allWithdrawals = [];

            usersSnap.forEach(userDoc => {
                const uid = userDoc.id;
                const userData = userDoc.data();
                const displayName = userData.displayName || uid;
                const withdrawals = userData.withdrawals || [];

                withdrawals.forEach(w => {
                    allWithdrawals.push({
                        ...w,
                        uid: uid,
                        userDisplayName: displayName,
                        userDocId: uid
                    });
                });
            });

            if (allWithdrawals.length === 0) {
                showToast('⚠️ لا توجد طلبات سحب', true);
            } else {
                showToast(`✅ تم جلب ${allWithdrawals.length} طلب`);
            }
            renderWithdrawalsList(allWithdrawals, 'جميع الطلبات');
            updateDiagnostic(allWithdrawals, usersSnap.size);
        } catch (err) {
            console.error('❌ فشل الجلب:', err);
            showToast('❌ فشل الجلب: ' + err.message, true);
            document.getElementById('adminWithdrawalsList').innerHTML = `
                <div class="admin-error">
                    <i class="fas fa-exclamation-triangle"></i>
                    <div>فشل جلب الطلبات: ${err.message}</div>
                    <button class="btn btn-primary btn-sm mt-16" onclick="fetchAllWithdrawals()" style="width:auto;margin:10px auto;">
                        <i class="fas fa-sync-alt"></i> حاول مرة أخرى
                    </button>
                </div>
            `;
        }
    }

    async function fetchPendingWithdrawals() {
        showToast('⏳ جلب المعلقة...');
        try {
            const usersSnap = await db.collection('users').get();
            const pending = [];

            usersSnap.forEach(userDoc => {
                const uid = userDoc.id;
                const userData = userDoc.data();
                const displayName = userData.displayName || uid;
                const withdrawals = userData.withdrawals || [];

                withdrawals.forEach(w => {
                    if (w.status === 'pending') {
                        pending.push({
                            ...w,
                            uid: uid,
                            userDisplayName: displayName,
                            userDocId: uid
                        });
                    }
                });
            });

            renderWithdrawalsList(pending, 'المعلقة');
            document.getElementById('pendingWithdrawalsCount').textContent = pending.length;
            showToast(`✅ ${pending.length} طلب معلق`);
            updateDiagnostic(pending, usersSnap.size);
        } catch (err) {
            console.error('❌ فشل الجلب:', err);
            showToast('❌ فشل الجلب: ' + err.message, true);
        }
    }

    // ============================================================
    // 5. عرض القائمة
    // ============================================================
    function renderWithdrawalsList(list, label = '') {
        const container = document.getElementById('adminWithdrawalsList');

        if (!list || list.length === 0) {
            container.innerHTML = `
                <div class="admin-empty">
                    <i class="fas fa-inbox"></i>
                    <div>لا توجد طلبات${label ? ' ('+label+')' : ''}</div>
                </div>
            `;
            return;
        }

        list.sort((a, b) => {
            const ta = a.createdAt?.toMillis?.() || 0;
            const tb = b.createdAt?.toMillis?.() || 0;
            return tb - ta;
        });

        container.innerHTML = list.map(w => {
            const userDisplay = w.userDisplayName || w.uid || 'مستخدم';
            const statusClass = w.status === 'pending' ? 'status-pending' :
                              w.status === 'completed' ? 'status-success' :
                              w.status === 'rejected' ? 'status-danger' : 'status-info';

            return `
                <div class="admin-request-card">
                    <div class="flex-between">
                        <span class="user-info">
                            👤 <strong>${userDisplay}</strong>
                            ${w.uid ? `<button class="copy-btn" onclick="copyText('${w.uid}')" style="padding:2px 8px;font-size:11px;background:var(--bg-input);color:var(--text-secondary);">
                                <i class="fas fa-copy"></i>
                            </button>` : ''}
                        </span>
                        <span class="status ${statusClass}">
                            ${w.status || 'غير معروف'}
                        </span>
                    </div>
                    <div class="details">
                        <strong>${w.amount} ${w.currency || 'DZD'}</strong> | الرسوم: ${w.fee || 0}
                        <br><small>التاريخ: ${formatDateTime(w.createdAt)}</small>
                        ${w.recipientAddress ? `<br><small>العنوان: ${w.recipientAddress}</small>` : ''}
                        ${w.withdrawalId ? `<br><small>المعرف: ${w.withdrawalId}</small>` : ''}
                    </div>
                    ${w.status === 'pending' ? `
                    <div class="actions">
                        <button class="btn btn-success btn-sm" onclick="approveWithdrawal('${w.userDocId}','${w.withdrawalId}','${w.uid}')">
                            <i class="fas fa-check"></i> تأكيد
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="rejectWithdrawal('${w.userDocId}','${w.withdrawalId}','${w.uid}',${w.amount},'${w.currency||'DZD'}')">
                            <i class="fas fa-times"></i> رفض
                        </button>
                    </div>` : ''}
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // 6. تشخيص
    // ============================================================
    function updateDiagnostic(withdrawalsList, totalUsers) {
        const diagEl = document.getElementById('diagnosticInfo');
        const pending = withdrawalsList.filter(w => w.status === 'pending').length;
        const total = withdrawalsList.length;

        let msg = `✅ تم التحليل بنجاح!\n`;
        msg += `👥 عدد المستخدمين: ${totalUsers}\n`;
        msg += `📋 إجمالي طلبات السحب: ${total}\n`;
        msg += `⏳ المعلقة (pending): ${pending}\n`;
        msg += `📁 موقع البيانات: users/*/withdrawals (مصفوفة)`;

        diagEl.textContent = msg;
        diagEl.className = 'diagnostic-box success';
    }

    // ============================================================
    // 7. تأكيد / رفض السحب (تعديل المصفوفة)
    // ============================================================
    async function approveWithdrawal(userDocId, withdrawalId, uid) {
        if (!confirm(`تأكيد سحب للمستخدم ${uid || userDocId}؟`)) return;

        try {
            const userRef = db.collection('users').doc(userDocId);
            const userDoc = await userRef.get();

            if (!userDoc.exists) {
                showToast('❌ المستخدم غير موجود', true);
                return;
            }

            const userData = userDoc.data();
            const withdrawals = userData.withdrawals || [];

            const updatedWithdrawals = withdrawals.map(w => {
                if (w.withdrawalId === withdrawalId) {
                    return { ...w, status: 'completed', completedAt: new Date() };
                }
                return w;
            });

            await userRef.update({ withdrawals: updatedWithdrawals });

            showToast('✅ تم تأكيد السحب');
            fetchPendingWithdrawals();
        } catch (e) {
            console.error(e);
            showToast('❌ خطأ: ' + e.message, true);
        }
    }

    async function rejectWithdrawal(userDocId, withdrawalId, uid, amount, currency) {
        if (!confirm(`رفض السحب وإعادة ${amount} ${currency} للمستخدم ${uid || userDocId}؟`)) return;

        try {
            const userRef = db.collection('users').doc(userDocId);
            const userDoc = await userRef.get();

            if (!userDoc.exists) {
                showToast('❌ المستخدم غير موجود', true);
                return;
            }

            const userData = userDoc.data();
            const withdrawals = userData.withdrawals || [];
            const wallets = userData.wallets || {};

            const updatedWithdrawals = withdrawals.map(w => {
                if (w.withdrawalId === withdrawalId) {
                    return { ...w, status: 'rejected', rejectedAt: new Date() };
                }
                return w;
            });

            const newDzd = (wallets.dzd || 0) + amount;

            await userRef.update({
                withdrawals: updatedWithdrawals,
                'wallets.dzd': newDzd
            });

            showToast(`❌ تم رفض السحب وإعادة ${amount} ${currency}`);
            fetchPendingWithdrawals();
        } catch (e) {
            console.error(e);
            showToast('❌ خطأ: ' + e.message, true);
        }
    }

    // ============================================================
    // 8. تأكيد إيداع تلقائي (DZD فقط)
    // ============================================================
    async function autoConfirmDeposit() {
        const txId = document.getElementById('autoTxId').value.trim();
        const amount = parseFloat(document.getElementById('autoAmount').value);

        if (!txId) { showToast('⚠️ أدخل رقم العملية', true); return; }
        if (!amount || amount <= 0) { showToast('⚠️ أدخل مبلغاً صحيحاً', true); return; }
        if (!confirm(`تأكيد تلقائي لإيداع ${amount} DZD برقم العملية ${txId}؟`)) return;

        try {
            const snap = await db.collection('deposits')
                .where('transactionId', '==', txId)
                .where('amount', '==', amount)
                .where('currency', '==', 'DZD')
                .where('status', '==', 'pending')
                .limit(1)
                .get();

            if (snap.empty) {
                showToast('❌ لم يتم العثور على طلب إيداع معلق بهذه البيانات', true);
                return;
            }

            const doc = snap.docs[0];
            const data = doc.data();
            const depositId = data.depositId || '';

            await approveDeposit(doc.id, data.uid, data.amount, data.currency, depositId);

            document.getElementById('autoTxId').value = '';
            document.getElementById('autoAmount').value = '';
            showToast(`✅ تم تأكيد الإيداع (${txId})`);
        } catch (e) {
            console.error(e);
            showToast('❌ خطأ: ' + e.message, true);
        }
    }

    async function approveDeposit(id, uid, amount, currency, depositId) {
        if (!confirm(`تأكيد إيداع ${amount} ${currency} للمستخدم ${uid}؟`)) return;
        try {
            await db.collection('deposits').doc(id).update({
                status: 'confirmed',
                confirmedAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            const userRef = db.collection('users').doc(uid);
            const userDoc = await userRef.get();
            if (!userDoc.exists) throw new Error('المستخدم غير موجود');

            const wallets = userDoc.data().wallets || {};
            await userRef.update({
                'wallets.dzd': (wallets.dzd || 0) + amount
            });

            showToast(`✅ تم تأكيد إيداع ${amount} ${currency}`);
        } catch (e) {
            console.error(e);
            showToast('❌ خطأ: ' + e.message, true);
        }
    }

    // ============================================================
    // 9. المصادقة
    // ============================================================
    function getTelegramUser() {
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand();
            return tg.initDataUnsafe?.user || null;
        }
        return null;
    }

    async function authAdmin() {
        const tgUser = getTelegramUser();
        if (!tgUser) {
            document.getElementById('unauthorizedMessage').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
            return;
        }
        userId = tgUser.id.toString();

        try {
            const userRef = db.collection('users').doc(userId);
            const userDoc = await userRef.get();
            if (!userDoc.exists) {
                await userRef.set({
                    telegramId: userId,
                    displayName: tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : ''),
                    joinDate: firebase.firestore.FieldValue.serverTimestamp(),
                    wallets: { main: 0, reward: 0, referral: 0, locked: 0, dzd: 0, dzdReward: 0, dzdReferral: 0, dzdLocked: 0 },
                    miningData: { currentPackage: null, totalMined: 0, totalMinedDZD: 0, totalReferrals: 0, miningHistory: { today: 0, todayDZD: 0, thisWeek: 0, thisWeekDZD: 0, thisMonth: 0, thisMonthDZD: 0 } },
                    transactions: [], referrals: [], deposits: [], withdrawals: []
                });
            }

            const adminDoc = await db.collection('admins').doc(userId).get();
            if (adminDoc.exists) {
                isAdmin = true;
                document.getElementById('adminStatusBadge').textContent = '✅ أدمن';
                document.getElementById('adminStatusBadge').className = 'status status-success';
                document.getElementById('unauthorizedMessage').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';

                await fetchAllWithdrawals();
                await fetchPendingWithdrawals();
            } else {
                document.getElementById('unauthorizedMessage').style.display = 'block';
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('adminStatusBadge').textContent = '❌ غير أدمن';
                document.getElementById('adminStatusBadge').className = 'status status-danger';
            }
        } catch (e) {
            console.error('❌ خطأ في المصادقة:', e);
            document.getElementById('unauthorizedMessage').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }
    }

    // ============================================================
    // 10. تحديث
    // ============================================================
    function refreshAll() {
        showToast('⏳ تحديث...');
        fetchAllWithdrawals();
        fetchPendingWithdrawals();
    }

    // ============================================================
    // 11. الوضع المظلم
    // ============================================================
    let dark = false;
    function toggleTheme() {
        dark = !dark;
        const root = document.documentElement;
        const btn = document.getElementById('themeToggle');
        if (dark) {
            root.style.setProperty('--bg-primary', '#0a0a1a');
            root.style.setProperty('--bg-secondary', '#12122a');
            root.style.setProperty('--bg-card', '#1a1a3e');
            root.style.setProperty('--bg-input', '#1a1a3e');
            root.style.setProperty('--text-primary', '#e8e8f0');
            root.style.setProperty('--text-secondary', '#8888aa');
            root.style.setProperty('--text-muted', '#555577');
            root.style.setProperty('--border', '#2a2a5a');
            btn.innerHTML = '<i class="fas fa-sun"></i>';
        } else {
            root.style.setProperty('--bg-primary', '#f0f4f8');
            root.style.setProperty('--bg-secondary', '#ffffff');
            root.style.setProperty('--bg-card', '#ffffff');
            root.style.setProperty('--bg-input', '#f0f4f8');
            root.style.setProperty('--text-primary', '#1a1a2e');
            root.style.setProperty('--text-secondary', '#4a4a6a');
            root.style.setProperty('--text-muted', '#8a8aaa');
            root.style.setProperty('--border', '#e2e8f0');
            btn.innerHTML = '<i class="fas fa-moon"></i>';
        }
    }

    // ============================================================
    // 12. INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        authAdmin();
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.BackButton.hide();
        }
    });

    console.log('🚀 لوحة الإدارة (نسخة نهائية تعمل)');
    console.log('✅ البيانات مقروءة من users/*/withdrawals');
    console.log('✅ العملة الوحيدة: DZD');
</script>
